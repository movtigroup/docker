server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        autoindex on;
        try_files $uri $uri/ =404;
    }

    # Specifically ensure .sh files are served as text/plain so they can be piped to bash
    location ~* \.sh$ {
        root /usr/share/nginx/html;
        add_header Content-Type text/plain;
    }
}
